name: release

# Builds the Windows release on a v* tag and attaches it to a DRAFT release (publishing stays a manual decision).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="v$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($want)"; exit 1; fi
      - name: Engine toolchain, translator, bundle
        run: |
          python tools/engine.py toolchain
          python tools/engine.py translator
          python tools/engine.py stage
      - name: Launcher
        working-directory: apps/launcher
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Release executables
        working-directory: apps/launcher/src-tauri
        env:
          # Opt-in diagnostics endpoint (docs/DIAGNOSTICS.md), a repository variable. Unset or empty: diagnostics off.
          AOD_DIAGNOSTICS_URL: ${{ vars.AOD_DIAGNOSTICS_URL }}
        run: cargo build --locked --release --bins --features tauri/custom-protocol
      - name: Release folder and zip
        run: python tools/release.py windows --zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            out/release/*.zip
            out/release/SHA256SUMS.txt
          if-no-files-found: error

  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: out/release
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          # Only a draft is ever filled or refilled: assets of a published release are never replaced.
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then echo "::error::release $tag is already published; its assets stay as they are"; exit 1; fi
          else
            # Not a pre-release: GitHub's "Latest" (the repository page, /releases/latest) is only ever a full release,
            # and with pre-releases alone the page showed "3 tags" and no release. Our launcher and RecompLauncher take
            # both kinds; the title says it is a preview.
            gh release create "$tag" --draft --title "Age of Decomp $tag" --notes "Draft: see the README for what is tested."
          fi
          gh release upload "$tag" out/release/*.zip out/release/SHA256SUMS.txt --clobber
