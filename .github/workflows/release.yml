name: release

# Builds the Windows release on a v* tag and attaches it to a DRAFT release (publishing stays a manual decision).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="v$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($want)"; exit 1; fi
      - name: Engine toolchain, checkout, translator, bundle
        run: |
          python tools/engine.py toolchain
          python tools/engine.py fetch
          python tools/engine.py translator
          python tools/engine.py stage
      - name: Launcher
        working-directory: apps/launcher
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Release executables
        working-directory: apps/launcher/src-tauri
        env:
          # Opt-in diagnostics endpoint (docs/DIAGNOSTICS.md), a repository variable. Unset or empty: diagnostics off.
          AOD_DIAGNOSTICS_URL: ${{ vars.AOD_DIAGNOSTICS_URL }}
        run: cargo build --locked --release --bins --features tauri/custom-protocol
      - name: Release folder and zip
        run: python tools/release.py windows --zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            out/release/*.zip
            out/release/SHA256SUMS.txt
          if-no-files-found: error

  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: out/release
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          # Only a draft is ever filled or refilled: assets of a published release are never replaced.
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then echo "::error::release $tag is already published; its assets stay as they are"; exit 1; fi
          else
            gh release create "$tag" --draft --prerelease --title "Age of Decomp $tag" --notes "Draft: see the README for what is tested."
          fi
          gh release upload "$tag" out/release/*.zip out/release/SHA256SUMS.txt --clobber
