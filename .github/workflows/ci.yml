name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  content-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/check_content.py --all

  repo-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Triage and RecompLauncher guide scripts
        run: node --test .github/scripts/triage.test.js
      - name: Release and engine tool guards
        run: python3 tools/test_release_guards.py

  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check GPU recorder policy, the input focus gate, the save's account, the Steam Deck profile and the button pictures without a game
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libvulkan-dev
          python3 engine/source/tests/hwaoi/test_amd_recorder_default.py
          python3 engine/source/tests/hwaoi/test_input_focus_gate.py
          python3 engine/source/tests/hwaoi/test_save_identity.py
          python3 engine/source/tests/hwaoi/test_device_profile.py
          python3 engine/source/tests/hwaoi/test_hud_prompts.py
      - name: Catalogue layout
        run: python3 tools/catalog_fmt.py --check

  nintendo-transport:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - run: python tools/engine.py toolchain
      - run: python tools/test_nintendo_transport.py
      - name: Test depth and stencil transfers
        env:
          AOD_CC: ${{ github.workspace }}/.cache/toolchain/windows/llvm/bin/clang.exe
          AOD_DEPS: ${{ github.workspace }}/.cache/toolchain/windows/deps/include
        run: python -I -B engine/source/tests/hwaoi/test_depth_stencil_copy.py

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          python3 tools/release.py manifest
          python3 tools/release.py docs
          git diff --exit-code packaging/recomplauncher.json docs/SETTINGS.md

  nup-crate:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: crates/aod-nup
      - run: cargo test
        working-directory: crates/aod-nup

  launcher:
    # The check keeps its name; the Linux runner is pinned to 24.04: on 2026-11-27 ubuntu-latest (26.04) read only
    # Microsoft's repository in apt-get update, and the WebKitGTK packages below were not found.
    name: launcher (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/launcher/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: pnpm install --frozen-lockfile
        working-directory: apps/launcher
      - run: pnpm check
        working-directory: apps/launcher
      - run: node --test tools/diagnostics/worker.test.mjs
        if: runner.os == 'Linux'
      - run: pnpm build
        working-directory: apps/launcher
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/launcher/src-tauri
      - run: cargo test
        working-directory: apps/launcher/src-tauri
