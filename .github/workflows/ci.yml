name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  content-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 tools/check_content.py --all

  repo-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Triage and RecompLauncher guide scripts
        run: node --test .github/scripts/triage.test.js

  engine-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: AOD_CACHE_DIR="$RUNNER_TEMP/aod" python3 tools/engine.py fetch
      - name: Check GPU recorder policy without a game
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libvulkan-dev
          python3 "$RUNNER_TEMP/aod/engine/hwaoi-recomp/tests/hwaoi/test_amd_recorder_default.py"
          python3 "$RUNNER_TEMP/aod/engine/hwaoi-recomp/tests/hwaoi/test_input_focus_gate.py"

  nintendo-transport:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
      - run: python tools/engine.py toolchain
      - run: python tools/test_nintendo_transport.py
      - run: python tools/engine.py fetch
      - name: Test depth and stencil transfers
        env:
          AOD_CC: ${{ github.workspace }}/.cache/toolchain/windows/llvm/bin/clang.exe
          AOD_DEPS: ${{ github.workspace }}/.cache/toolchain/windows/deps/include
        run: python -I -B .cache/engine/hwaoi-recomp/tests/hwaoi/test_depth_stencil_copy.py

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: |
          python3 tools/release.py manifest
          python3 tools/release.py docs
          git diff --exit-code packaging/recomplauncher.json docs/SETTINGS.md

  nup-crate:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: crates/aod-nup
      - run: cargo test
        working-directory: crates/aod-nup

  launcher:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/launcher/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: pnpm install --frozen-lockfile
        working-directory: apps/launcher
      - run: pnpm check
        working-directory: apps/launcher
      - run: node --test tools/diagnostics/worker.test.mjs
        if: runner.os == 'Linux'
      - run: pnpm build
        working-directory: apps/launcher
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/launcher/src-tauri
      - run: cargo test
        working-directory: apps/launcher/src-tauri
