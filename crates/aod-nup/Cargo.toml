[package]
name = "aod-nup"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Read-only reader for NUP containers (unencrypted Switch / Switch 2 dumps) and the Age of Decomp game profile check"
publish = false

[lib]
name = "aod_nup"

[[bin]]
name = "aod-nup"
path = "src/main.rs"

[dependencies]
ruzstd = "0.9"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
